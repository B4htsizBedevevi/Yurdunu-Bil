name: Load V12 Smart Study Center
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: yurdunu-bil-inject
  cancel-in-progress: true
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject dashboard scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html içinde </body> bulunamadı')
          tags = [
              '<script src="advanced.js"></script>',
              '<script src="quickfacts.js"></script>',
              '<script src="news.js"></script>',
              '<script src="innovation.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Script tags already up to date.'
            exit 0
          fi
          git commit -m 'feat: add daily challenge mode'
          git push
