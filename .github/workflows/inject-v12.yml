name: Load Study Center Scripts
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: yurdunu-bil-inject
  cancel-in-progress: true
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync dashboard scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html içinde </body> bulunamadı')
          for tag in [
              '<script src="news.js"></script>',
              '<script src="ux-v13.js"></script>',
              '<script src="ux-v13.js?v=13.0.1"></script>',
              '<script src="ux-v14.js"></script>',
              '<script src="ux-v15.js"></script>',
              '<script src="ux-v16.js"></script>',
              '<script src="ux-v16.js?v=16.0.0"></script>',
              '<script src="ux-v17.js"></script>',
              '<script src="ux-v17.js?v=17.0.0"></script>',
              '<script src="ux-v18.js"></script>',
              '<script src="ux-v18.js?v=18.0.0"></script>',
              '<script src="ux-v19.js"></script>',
              '<script src="ux-v19.js?v=19.0.0"></script>',
              '<script src="ux-v20.js"></script>',
              '<script src="ux-v20.js?v=20.0.0"></script>'
          ]:
              s = s.replace(tag + '\n', '').replace(tag, '')
          s = s.replace('<script src="pomodoro.js?v=1.0.0"></script>', '<script src="pomodoro.js?v=1.0.1"></script>')
          tags = [
              '<script src="advanced.js"></script>',
              '<script src="quickfacts.js"></script>',
              '<script src="innovation.js"></script>',
              '<script src="pomodoro.js?v=1.0.1"></script>',
              '<script src="province-study.js?v=1.0.0"></script>',
              '<script src="ux-v17.js?v=17.0.0"></script>',
              '<script src="ux-v18.js?v=18.0.0"></script>',
              '<script src="ux-v19.js?v=19.0.0"></script>',
              '<script src="ux-v20.js?v=20.0.0"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Dashboard scripts already up to date.'
            exit 0
          fi
          git commit -m 'feat: load v20 mobile conflict resolver'
          git push
