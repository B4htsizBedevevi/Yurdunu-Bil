name: Load Study Center Scripts
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: yurdunu-bil-inject
  cancel-in-progress: true
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync dashboard scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html içinde </body> bulunamadı')
          # Eski UX katmanlarını ve tekrarlarını tamamen temizle.
          import re
          s = re.sub(r'\s*<script src="(?:news\.js|ux-v(?:13|14|15|16|17|18|19|20)\.js)(?:\?v=[^"]+)?"></script>', '', s)
          s = s.replace('<script src="pomodoro.js?v=1.0.0"></script>', '<script src="pomodoro.js?v=1.0.1"></script>')
          tags = [
              '<script src="advanced.js"></script>',
              '<script src="quickfacts.js"></script>',
              '<script src="innovation.js"></script>',
              '<script src="pomodoro.js?v=1.0.1"></script>',
              '<script src="province-study.js?v=1.0.0"></script>',
              '<script src="ux-v19.js?v=19.0.1"></script>',
              '<script src="ux-v20.js?v=20.0.1"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Dashboard scripts already up to date.'
            exit 0
          fi
          git commit -m 'chore: normalize dashboard script stack'
          git push
