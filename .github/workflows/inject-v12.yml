name: Load V12 Smart Study Center
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject dashboard scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('index.html içinde </body> bulunamadı')
          tags = ['<script src="advanced.js"></script>', '<script src="quickfacts.js"></script>']
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add KPSS quick facts and mobile map fix'
          git push
