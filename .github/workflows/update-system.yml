name: Yurdunu Bil Update System

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: yurdunu-bil-update-system
  cancel-in-progress: true

jobs:
  update-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./version.json').version)")
          test -n "$VERSION"
          test -f quickfacts.js
          test -f advanced.js
          test -f updates.js
          test -f config.js
          test -f index.html
          echo "Yurdunu Bil $VERSION dosya kontrolü başarılı."

      - name: Report update status
        shell: bash
        run: |
          echo "Update System artık dosya push etmiyor."
          echo "Site güncellemeleri ana push/deploy zincirinden geliyor."
          echo "Bu workflow yalnızca kontrol yapıyor; gereksiz push çakışması ve başarısız e-posta üretmiyor."
