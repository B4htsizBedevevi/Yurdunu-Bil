name: Fix UTF-8 Encoding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair mojibake
        run: node scripts/fix-mojibake.js

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No encoding changes needed."
            exit 0
          fi
          git add -- '*.html' '*.js' '*.css' '*.json' '*.md' '*.txt'
          git commit -m "fix: repair Turkish UTF-8 text"
          git push
