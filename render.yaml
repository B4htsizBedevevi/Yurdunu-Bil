services:
  - type: web
    runtime: static
    name: Yurdunu-Bil
    buildCommand: echo "Static site - no build required"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /*
        name: Pragma
        value: "no-cache"
      - path: /*
        name: Expires
        value: "0"
